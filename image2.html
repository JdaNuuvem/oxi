<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Panela suja e queimada</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
        body { display: flex; align-items: center; justify-content: center; }
        img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; display: block; }
        .hint { position: fixed; left: 0; right: 0; bottom: 16px; text-align: center; color: rgba(255,255,255,.7);
                font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; font-size: 14px; pointer-events: none; }
        body.fs .hint { display: none; }
    </style>
</head>
<body>
    <img src="image2.jpg" alt="Panela suja e queimada">
    <div class="hint">Toque para tela cheia</div>
    <script>
        document.body.addEventListener('click', function () {
            var el = document.documentElement;
            if (document.fullscreenElement || document.webkitFullscreenElement) { return; }
            var req = el.requestFullscreen || el.webkitRequestFullscreen;
            if (req) { req.call(el).then(function () { document.body.classList.add('fs'); }).catch(function () {}); }
        });
        document.addEventListener('fullscreenchange', function () {
            document.body.classList.toggle('fs', !!document.fullscreenElement);
        });
    </script>
</body>
</html>
